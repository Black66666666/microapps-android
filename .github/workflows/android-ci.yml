name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_MODULES: "screenshot-inbox match-choice who-brings-what buy-tomorrow meeting-meter scroll-receipt worth-it borrow-back box-qr refill turn-keeper five-minutes return-clock where-is-it opened-on pack-together promise gift-pocket before-leave fair-pick"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Unit tests
        shell: bash
        run: |
          tasks=(":core:microappkit:testDebugUnitTest")
          for m in $APP_MODULES; do tasks+=(":apps:$m:testDebugUnitTest"); done
          gradle --stacktrace "${tasks[@]}"
      - name: Lint
        shell: bash
        run: |
          tasks=(":core:designsystem:lintDebug" ":core:microappkit:lintDebug")
          for m in $APP_MODULES; do tasks+=(":apps:$m:lintDebug"); done
          gradle --stacktrace "${tasks[@]}"
      - name: Compile instrumented test APKs
        shell: bash
        run: |
          tasks=()
          for m in $APP_MODULES; do tasks+=(":apps:$m:assembleDebugAndroidTest"); done
          gradle --stacktrace "${tasks[@]}"
      - name: Build all debug APKs
        shell: bash
        run: |
          tasks=(":core:designsystem:assembleDebug" ":core:microappkit:assembleDebug")
          for m in $APP_MODULES; do tasks+=(":apps:$m:assembleDebug"); done
          gradle --stacktrace "${tasks[@]}"
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-20-tested-apks
          path: apps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator:
    needs: quality
    runs-on: ubuntu-latest
    env:
      APP_MODULES: "screenshot-inbox match-choice who-brings-what buy-tomorrow meeting-meter scroll-receipt worth-it borrow-back box-qr refill turn-keeper five-minutes return-clock where-is-it opened-on pack-together promise gift-pocket before-leave fair-pick"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            tasks=()
            for m in $APP_MODULES; do tasks+=(":apps:$m:connectedDebugAndroidTest"); done
            gradle --stacktrace "${tasks[@]}"
