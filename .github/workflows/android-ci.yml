name: Android CI

on:
  push:
    branches: [main, wave-1-foundation, wave-1-unified-design]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --stacktrace :apps:screenshot-inbox:testDebugUnitTest :apps:match-choice:testDebugUnitTest :apps:who-brings-what:testDebugUnitTest :apps:buy-tomorrow:testDebugUnitTest :apps:meeting-meter:testDebugUnitTest
      - name: Lint
        run: gradle --stacktrace :core:designsystem:lintDebug :apps:screenshot-inbox:lintDebug :apps:match-choice:lintDebug :apps:who-brings-what:lintDebug :apps:buy-tomorrow:lintDebug :apps:meeting-meter:lintDebug
      - name: Compile instrumented test APKs
        run: gradle --stacktrace :apps:screenshot-inbox:assembleDebugAndroidTest :apps:match-choice:assembleDebugAndroidTest :apps:who-brings-what:assembleDebugAndroidTest :apps:buy-tomorrow:assembleDebugAndroidTest :apps:meeting-meter:assembleDebugAndroidTest
      - name: Build Wave 1 debug APKs
        run: gradle --stacktrace :core:designsystem:assembleDebug :apps:screenshot-inbox:assembleDebug :apps:match-choice:assembleDebug :apps:who-brings-what:assembleDebug :apps:buy-tomorrow:assembleDebug :apps:meeting-meter:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wave-1-unified-tested-apks
          path: apps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: gradle --stacktrace :apps:screenshot-inbox:connectedDebugAndroidTest :apps:match-choice:connectedDebugAndroidTest :apps:who-brings-what:connectedDebugAndroidTest :apps:buy-tomorrow:connectedDebugAndroidTest :apps:meeting-meter:connectedDebugAndroidTest
