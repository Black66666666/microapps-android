name: Android CI

on:
  push:
    branches: [main, wave-1-foundation]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Wave 1 debug APKs
        run: gradle --stacktrace :apps:screenshot-inbox:assembleDebug :apps:match-choice:assembleDebug :apps:who-brings-what:assembleDebug :apps:buy-tomorrow:assembleDebug :apps:meeting-meter:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wave-1-debug-apks
          path: apps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
